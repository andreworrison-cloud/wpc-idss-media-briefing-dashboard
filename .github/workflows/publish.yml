name: Publish IDSS briefing
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]

permissions: {}
concurrency:
  group: idss-pages-publication
  cancel-in-progress: false

jobs:
  build:
    outputs:
      revision: ${{ steps.snapshot.outputs.revision }}
      pages_artifact: ${{ steps.snapshot.outputs.pages_artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/exposure-requirements.txt
      - name: Install Census geometry dependencies
        run: python -m pip install -r scripts/exposure-requirements.txt
      - name: Test publication checks
        run: PYTHONPATH=scripts python3 -m unittest discover -s tests
      - name: Check hazard colors and outage geography
        run: node --test tests/*.test.mjs
      - name: Restore the last verified WSSI polygon file
        id: wssi_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/idss-wssi/native.json.gz
          key: idss-wssi-lookup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: idss-wssi-native-v1-
      - name: Restore the last verified all-category Census calculation
        id: all_bands_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/idss-wssi/all-bands-population.json
          key: idss-all-bands-lookup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: idss-all-bands-census-v1-
      - name: Build the reviewed briefing
        id: snapshot
        env:
          IDSS_WSSI_CACHE_DIR: ${{ runner.temp }}/idss-wssi
        run: |
          python3 scripts/publish.py
          echo "pages_artifact=idss-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          python3 -c 'import json; print("revision=" + json.load(open("_site/data/board.json"))["revision"])' >> "$GITHUB_OUTPUT"
          if [[ -f "$IDSS_WSSI_CACHE_DIR/confirmed-key" ]]; then
            echo "wssi_key=idss-wssi-native-v1-$(cat "$IDSS_WSSI_CACHE_DIR/confirmed-key")" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "$IDSS_WSSI_CACHE_DIR/all-bands-population.json" ]]; then
            python3 -c 'import json, os; print("full_wssi_key=" + json.load(open(os.path.join(os.environ["IDSS_WSSI_CACHE_DIR"], "all-bands-population.json")))["key"])' >> "$GITHUB_OUTPUT"
          fi
      - name: Save the newly verified WSSI issuance
        if: steps.snapshot.outputs.wssi_key != '' && steps.snapshot.outputs.wssi_key != steps.wssi_cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/idss-wssi/native.json.gz
          key: ${{ steps.snapshot.outputs.wssi_key }}
      - name: Save the Census calculation for this WSSI issue
        if: steps.snapshot.outputs.full_wssi_key != '' && format('idss-all-bands-census-v1-{0}', steps.snapshot.outputs.full_wssi_key) != steps.all_bands_cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/idss-wssi/all-bands-population.json
          key: idss-all-bands-census-v1-${{ steps.snapshot.outputs.full_wssi_key }}
      - name: Publish the reviewed current-data pointer in this repo
        env:
          IDSS_PUBLICATION_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_current.py
      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.snapshot.outputs.pages_artifact }}
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Confirm the repository’s Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pages_source.py
      - name: Publish the complete release
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}
      - name: Verify the live briefing
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: python3 -m scripts.verify_pages "$PAGE_URL" "$REVISION"
      - name: Exercise the briefing map and reports in Chrome
        if: github.event_name != 'schedule'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/check_browser.py "$PAGE_URL"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule' && always()
        with:
          name: briefing-browser-check-${{ github.run_attempt }}
          path: browser-check/*.png
          retention-days: 3
          if-no-files-found: ignore
