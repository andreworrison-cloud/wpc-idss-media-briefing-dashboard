name: Publish IDSS briefing
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]

permissions: {}
concurrency:
  group: idss-pages-publication
  cancel-in-progress: false

jobs:
  build:
    outputs:
      revision: ${{ steps.snapshot.outputs.revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/exposure-requirements.txt
      - name: Install Census geometry dependencies
        run: python -m pip install -r scripts/exposure-requirements.txt
      - name: Test publication checks
        run: PYTHONPATH=scripts python3 -m unittest discover -s tests
      - name: Check hazard colors and outage geography
        run: node --test tests/*.test.mjs
      - name: Build the reviewed briefing
        id: snapshot
        run: |
          python3 scripts/publish.py
          python3 -c 'import json; print("revision=" + json.load(open("_site/data/board.json"))["revision"])' >> "$GITHUB_OUTPUT"
      - name: Publish the reviewed current-data pointer in this repo
        env:
          IDSS_PUBLICATION_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_current.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Confirm the repository’s Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pages_source.py
      - name: Publish the complete release
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live briefing
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: python3 -m scripts.verify_pages "$PAGE_URL" "$REVISION"
      - name: Exercise the published command center in Chrome
        if: github.event_name != 'schedule'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/check_browser.py "$PAGE_URL"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule' && always()
        with:
          name: command-center-browser-check
          path: browser-check/*.png
          retention-days: 3
          if-no-files-found: ignore
